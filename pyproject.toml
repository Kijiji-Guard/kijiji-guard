[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kijiji-guard"
version = "0.1.0"
description = "Open-source compliance scanner for African data protection laws — NDPA, Ghana DPA, Kenya DPA, Rwanda Law 058, Egypt PDPL and more"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
  { name = "Kijiji-Guard Contributors", email = "imambash6@gmail.com" }
]
keywords = [
  "compliance", "security", "ndpa", "africa",
  "data-protection", "terraform", "devsecops",
  "nigeria", "ghana", "kenya", "rwanda", "egypt"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
]
dependencies = [
  "python-hcl2>=4.3.0",
  "rich>=13.0.0",
  "typer>=0.9.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.24.0",
  "beautifulsoup4>=4.12.0",
  "sqlite-utils>=3.30",
  "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.23.0",
]
cloud = [
  "boto3>=1.28.0",
  "pydo>=5.0.0",
]

[project.scripts]
kijiji-guard = "kijiji_guard.main:app"

[project.urls]
Homepage = "https://github.com/Kijiji-Guard/kijiji-guard"
Repository = "https://github.com/Kijiji-Guard/kijiji-guard"
"Bug Tracker" = "https://github.com/Kijiji-Guard/kijiji-guard/issues"
Documentation = "https://github.com/Kijiji-Guard/kijiji-guard#readme"

[tool.hatch.build.targets.wheel]
packages = ["kijiji_guard"]

[tool.hatch.build.targets.sdist]
include = [
  "kijiji_guard/",
  "policies/",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "NOTICE",
]
